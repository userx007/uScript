# =============================================================================
#  uscript.ini  —  uScript runtime configuration
# =============================================================================
#
#  Boolean values accept:  true / false  (case-insensitive)
#  Log severity levels:    0 = VERBOSE
#                          1 = DEBUG
#                          2 = INFO
#                          3 = WARNING
#                          4 = ERROR
#                          5 = FATAL
#                          6 = FIXED
# =============================================================================

[COMMON]

# (reserved for future common runtime settings)


# =============================================================================
[LOGGING]
# All settings that control the logger behaviour live here.
# If this section is absent the built-in defaults from uLogger.hpp apply.
# =============================================================================

# ── Console log severity threshold ───────────────────────────────────────────
# Only messages at or above this level are printed to the console.
# Default: 0 (VERBOSE — print everything)
LOG_SEVERITY_CONSOLE = 0

# ── File log severity threshold ───────────────────────────────────────────────
# Only messages at or above this level are written to the log file.
# Has no effect when LOG_FILE_ENABLED = false.
# Default: 0 (VERBOSE)
LOG_SEVERITY_FILE = 0

# ── Prepend date to every log timestamp ──────────────────────────────────────
# false → "HH:MM:SS.uuuuuu | …"
# true  → "YYYY-MM-DD HH:MM:SS.uuuuuu | …"
# Default: false
LOG_INCLUDE_DATE = FALSE

# ── Coloured console output ───────────────────────────────────────────────────
# Each log level is printed in a distinct ANSI colour when enabled.
# Disable when piping output to a file or a terminal that lacks ANSI support.
# Default: true
LOG_CONSOLE_COLORED = TRUE

# ── Write log to file ────────────────────────────────────────────────────────
# When true, a timestamped log file (log_YYYYMMDD_HHMMSS.txt) is created
# in the working directory and every message at or above LOG_SEVERITY_FILE
# is appended to it.
# Default: false
LOG_FILE_ENABLED = FALSE


# ── Include calling-thread ID in every log line ───────────────────────────────
# When true, the numeric OS thread ID of the thread that emitted each message
# is printed immediately after the timestamp, separated by " | ".
#
# Output format examples:
#   true  → "14:03:22.048712 | 140234567890432 |   INFO | USCRIPT_MAIN| …"
#   false → "14:03:22.048712 |   INFO | USCRIPT_MAIN| …"
#
# The ID is the OS-level thread identifier (pthread ID on Linux/macOS,
# Win32 thread ID on Windows), so it matches what debuggers and system
# tools (e.g. ps -L, Process Explorer) display.
# Logging from the main thread prints the main-thread ID;
# logging from a background "&" thread prints that thread's own ID.
#
# Set to false for single-threaded runs or when thread attribution is not
# needed and a more compact log format is preferred.
# Default: true
LOG_INCLUDE_THREAD_ID = TRUE


# =============================================================================
[SHARED]
FAULT_TOLERANT          = FALSE
PRIVILEGED              = FALSE
ARTEFACTS_PATH          = .
UART_PORT               = /dev/tnt0
BAUDRATE                = 115200
READ_TIMEOUT            = 3000
WRITE_TIMEOUT           = 3000
READ_BUF_SIZE           = 1024
READ_BUF_TIMEOUT        = 3000
SCRIPT_DELAY            = 0

# =============================================================================
[SCRIPT]

# ── Inter-command execution delay ────────────────────────────────────────────
# Pause inserted between every plugin command execution, in milliseconds.
# Useful for pacing hardware communication without adding DELAY commands
# to every script.  Set to 0 to disable.
# Default: 0
CMD_EXEC_DELAY = 0


# =============================================================================
[KVCAN]
PRIVILEGED              = ${SHARED:PRIVILEGED}


# =============================================================================
[TCPIP]
PRIVILEGED              = ${SHARED:PRIVILEGED}

ARTEFACTS_PATH = .
TCP_HOST = 127.0.0.1
TCP_PORT = 5000
TCP_CONNECT_TIMEOUT = 500
TCP_READ_TIMEOUT    = 3000
TCP_WRITE_TIMEOUT   = 5000
TCP_READ_BUFFER_SIZE = 128

# =============================================================================
[UDP]
PRIVILEGED              = ${SHARED:PRIVILEGED}

ARTEFACTS_PATH = .
UDP_HOST = 127.0.0.1
UDP_PORT = 5050
UDP_CONNECT_TIMEOUT = 500
UDP_READ_TIMEOUT    = 3000
UDP_WRITE_TIMEOUT   = 5000
UDP_READ_BUFFER_SIZE = 128


# =============================================================================
[KI2C]
PRIVILEGED              = ${SHARED:PRIVILEGED}

ARTEFACTS_PATH = .
I2C_DEVICE = /dev/i2c-1
I2C_ADDRESS = 0x48
READ_TIMEOUT = 2000
WRITE_TIMEOUT = 2000
READ_BUF_SIZE = 128